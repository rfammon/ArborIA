<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Rápido - Arboria Module</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .result { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; border: 1px solid #bee5eb; }
    </style>
</head>
<body>
    <h1>🚀 Teste Rápido - Arboria Module</h1>
    <div id="results"></div>

    <script type="module">
        const results = document.getElementById('results');

        function addResult(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `result ${type}`;
            div.textContent = message;
            results.appendChild(div);
        }

        try {
            addResult('🔄 Carregando módulo...', 'info');

            // Forçar reload do módulo
            const moduleUrl = './js/arboria-module.js?v=' + Date.now();
            const module = await import(moduleUrl);

            addResult('✅ Módulo carregado sem erros de sintaxe!', 'success');

            // Verificar se PlanningModule existe
            if (module.PlanningModule) {
                addResult('✅ PlanningModule encontrado', 'success');

                // Verificar métodos essenciais
                const methods = ['mount', 'unmount'];
                methods.forEach(method => {
                    if (typeof module.PlanningModule[method] === 'function') {
                        addResult(`✅ Método ${method} é uma função`, 'success');
                    } else {
                        addResult(`❌ Método ${method} não encontrado`, 'error');
                    }
                });

                // Verificar Actions
                if (module.PlanningModule.Actions) {
                    addResult('✅ Actions encontrado', 'success');

                    if (typeof module.PlanningModule.Actions.handleFormSubmit === 'function') {
                        addResult('✅ handleFormSubmit é assíncrona', 'success');
                    } else {
                        addResult('❌ handleFormSubmit não é uma função', 'error');
                    }
                } else {
                    addResult('❌ Actions não encontrado', 'error');
                }

            } else {
                addResult('❌ PlanningModule não encontrado', 'error');
            }

        } catch (error) {
            addResult(`❌ Erro ao carregar módulo: ${error.message}`, 'error');
            console.error('Erro detalhado:', error);
        }
    </script>
</body>
</html>
